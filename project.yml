# project.yml
# مواصفات XcodeGen لتوليد ملف SmartGradeScanner.xcodeproj

name: SmartGradeScanner

options:
  bundleIdPrefix: com.smartgradescanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

targets:
  SmartGradeScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Utilities
      - path: Resources/Templates
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: SmartGradeScanner
        PRODUCT_BUNDLE_IDENTIFIER: com.smartgradescanner.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"

        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

        GENERATE_INFOPLIST_FILE: YES

        INFOPLIST_KEY_CFBundleDisplayName: "SmartGradeScanner"

        INFOPLIST_KEY_UILaunchScreen_Generation: YES

        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

        INFOPLIST_KEY_NSCameraUsageDescription: "يحتاج التطبيق للكاميرا لمسح أوراق الإجابة وتصحيحها."

        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "يحتاج التطبيق للوصول لمكتبة الصور لاختيار صورة ورقة إجابة ممسوحة مسبقاً."

      configs:
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
