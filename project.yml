# project.yml
# مواصفات XcodeGen (https://github.com/yonaskolb/XcodeGen) لتوليد ملف
# SmartGradeScanner.xcodeproj تلقائياً من مجلدات الكود المصدري، بدون
# الحاجة لإنشاء/صيانة ملف .xcodeproj يدوياً أو الاحتفاظ به داخل Git
# (ملفات pbxproj تسبب تعارضات دمج كثيرة). يُستخدم هذا الملف من:
#   - سير عمل GitHub Actions: .github/workflows/build-ios-ipa.yml
#   - محلياً: ثبّت XcodeGen (brew install xcodegen) ثم شغّل `xcodegen generate`
#     داخل هذا المجلد، وافتح SmartGradeScanner.xcodeproj الناتج في Xcode.

name: SmartGradeScanner

options:
  bundleIdPrefix: com.smartgradescanner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

targets:
  SmartGradeScanner:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Utilities
      # مجلد مرجعي (Folder Reference / أزرق) كي تبقى بنية الملفات كما هي
      # ويقدر Bundle.main.url(forResource:withExtension:subdirectory:"Templates")
      # يجدها بنفس الاسم بالضبط وقت التشغيل.
      - path: Resources/Templates
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_NAME: SmartGradeScanner
        PRODUCT_BUNDLE_IDENTIFIER: com.smartgradescanner.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

        # يولّد Info.plist تلقائياً من مفاتيح الإعدادات أدناه بدل ملف
        # يدوي منفصل - أبسط للصيانة ولخط أنابيب CI.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "SmartGradeScanner"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # أذونات الكاميرا والمعرض المطلوبة لمسح أوراق الإجابة
        INFOPLIST_KEY_NSCameraUsageDescription: "يحتاج التطبيق للكاميرا لمسح أوراق الإجابة وتصحيحها."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "يحتاج التطبيق للوصول لمكتبة الصور لاختيار صورة ورقة إجابة ممسوحة مسبقاً."

      configs:
        Release:
          # بناء بدون توقيع في الـ CI (Unsigned build) - راجع ملف
          # الـ workflow لشرح كيفية إضافة توقيع فعلي لاحقاً إن رغبت
          # بتوزيع IPA قابل للتثبيت المباشر.
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
