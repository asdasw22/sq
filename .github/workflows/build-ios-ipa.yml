# .github/workflows/build-ios-ipa.yml
#
# يبني هذا السير تطبيق SmartGradeScanner ويُخرج ملف .ipa كـ Artifact
# قابل للتحميل من صفحة الـ Actions في GitHub - بدون الحاجة لجهاز Mac
# شخصي أو حساب Apple Developer، لأن GitHub يوفّر macOS runners.
#
# ملاحظة مهمة عن التوقيع (Code Signing):
# هذا البناء الافتراضي "غير موقّع" (Unsigned) لأنه لا يوجد شهادة توزيع
# Apple مُدخلة كـ Secret. الـ IPA الناتج مناسب لـ:
#   - المراجعة/الفحص، أو إعادة التوقيع لاحقاً محلياً عبر أدوات مثل
#     Sideloadly / AltStore بحساب Apple ID شخصي مجاني.
# لتفعيل توقيع حقيقي (تثبيت مباشر على جهاز أو رفع لـ TestFlight)،
# أضف Secrets التالية في إعدادات المستودع (Settings → Secrets → Actions)
# ثم فعّل الخطوة الاختيارية "Import signing certificate" أسفل هذا الملف:
#   BUILD_CERTIFICATE_BASE64        شهادة التوزيع (.p12) بصيغة Base64
#   P12_PASSWORD                    كلمة سر ملف الـ .p12
#   BUILD_PROVISION_PROFILE_BASE64  ملف Provisioning Profile بصيغة Base64
#   KEYCHAIN_PASSWORD                كلمة سر مؤقتة لأي قيمة عشوائية تختارها

name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}   # يسمح بتشغيل السير يدوياً من تبويب Actions

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30

    env:
      SCHEME: SmartGradeScanner
      PROJECT: SmartGradeScanner.xcodeproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Cache Homebrew / XcodeGen
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-xcodegen

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      # ---- (اختياري) استيراد شهادة توقيع حقيقية إن توفرت الـ Secrets ----
      # فعّل هذه الخطوة (احذف التعليق) بعد إضافة الـ Secrets الموضّحة أعلاه
      # إن أردت IPA موقّعاً قابلاً للتثبيت المباشر:
      #
      # - name: Import signing certificate & provisioning profile
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      #     BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERT_PATH=$RUNNER_TEMP/certificate.p12
      #     PP_PATH=$RUNNER_TEMP/profile.mobileprovision
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #     echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
      #     echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #     security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #     security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #     security list-keychain -d user -s $KEYCHAIN_PATH
      #     mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
      #     cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build .app (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package .app into .ipa
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/${SCHEME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "لم يتم العثور على ملف .app في المسار المتوقع: $APP_PATH"
            find build -maxdepth 5 -name "*.app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p dist
          zip -r "dist/${SCHEME}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-unsigned-ipa
          path: dist/*.ipa
          retention-days: 14

      - name: Upload raw .app (for debugging/simulator use)
        uses: actions/upload-artifact@v4
        with:
          name: SmartGradeScanner-app-bundle
          path: build/Build/Products/Release-iphoneos/${{ env.SCHEME }}.app
          retention-days: 14
